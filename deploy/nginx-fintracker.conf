server {
    listen 80;
    listen [::]:80;
    server_name fintracker.ztox.in;

    root /var/www/fintracker/web;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/fintracker/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/fintracker/backend/public;
        fastcgi_param REQUEST_URI $request_uri;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
